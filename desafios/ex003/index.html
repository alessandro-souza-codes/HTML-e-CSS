<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags em HTML</title>
</head>
<body>
    <h1>Tags em HTML</h1>
    <p><abbr title="Use a tag &lt;p&gt;">Páragrafo</abbr></p>
    <p><abbr title="Use a tag &lt;h1&gt;">Títulos</abbr></p>
    <p><abbr title="Use a tag &lt;img&gt;">Imagens</abbr></p>
    <p><abbr title="Use a tag &lt;abbr&gt;">Abreviações</abbr></p>
    <p><abbr title="Use a tag &lt;code&gt;">Codigo-fonte</abbr></p>
    <p><abbr title="Use a tag &lt;ol&gt; e para demarcar use a tag &lt;li&gt;">Listas númeradas</abbr></p>
    <p><abbr title="Use a tag &lt;ul&gt; e para demarcar use a tag &lt;li&gt;">Listas com demarcadores</abbr></p>
</body>
</html>
