<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="" type="image/x-icon">
    <title>Mídias em HTML5</title>
</head>
<body>
    <h1>Imagem dinamica</h1>
    <p>Temte abrir essa imagem em varios dispositivos diferentes ou simplesmente aumente e diminua o tamanho do seu navegadr</p>
    <picture>
        <source media="(max-width: 750px)" srcset="imagens/pequena.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="imagens/media.png" type="image/png">
        <img src="imagens/grande.png" alt="Imagem Flexivel">
    </picture>
    <h1>Reproduzindo Áudio</h1>
    <p>Vamos aprender a reprodizir áudios em HTML5</p>
    <!--<audio src="mídia/WhatsApp Audio 2026-07-07 at 8.26.16 PM.mpeg" controls autoplay</audio>
    mp3 wav ogg-->
    <audio preload="metadata" controls loop>
        <source src="mídia/WhatsApp Audio 2026-07-07 at 8.26.16 PM.mpeg" type="audio/mpeg">
        <source src="mídia/WhatsApp Audio 2026-07-07 at 8.26.16 PM.mpeg" type="audio/ogg">
        <source src="mídia/WhatsApp Audio 2026-07-07 at 8.26.16 PM.mpeg" type="audio/wav">
        <p>O navegador não consegue reproduzir o audio, voçê quiser baixar o site clique em &#9758; <a href="mídia/WhatsApp Audio 2026-07-07 at 8.26.16 PM.mpeg" download="mídia/WhatsApp Audio 2026-07-07 at 8.26.16 PM.mpeg" type="application/mpeg">Baixar audio</a></p>
    </audio>
</body>
</html>
